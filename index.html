<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Entradas - Sistema de Trámites Académicos</title>
    <!-- Tailwind CSS CDN para un diseño profesional -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .uppercase-input { text-transform: uppercase; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">
    <div class="max-w-3xl mx-auto bg-white shadow-lg rounded-lg p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Portal de Trámites Académicos</h1>
        
        <form id="tramiteForm" class="space-y-6">
            <!-- Datos Personales -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">DNI (8 dígitos exactos)</label>
                    <input type="text" id="dni" name="dni" required maxlength="8" pattern="\d{8}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Apellido</label>
                    <input type="text" id="apellido" name="apellido" required class="uppercase-input mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required class="uppercase-input mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                </div>
            </div>

            <!-- Ubicación y Selección de Trámite -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Sede</label>
                    <select id="sede" name="sede" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 bg-white">
                        <option value="">Seleccione Sede...</option>
                        <option value="Central">Central</option>
                        <option value="Uspallata">Uspallata</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Tipo de Trámite</label>
                    <select id="tipoTramite" name="tipoTramite" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 bg-white" onchange="actualizarCamposArchivos()">
                        <option value="">Seleccione Trámite...</option>
                        <option value="Analítico Incompleto">Analítico Incompleto</option>
                        <option value="Analítico Completo">Analítico Completo</option>
                        <option value="Título Digital">Título Digital</option>
                        <option value="Certificación Profesional">Certificación Profesional</option>
                    </select>
                </div>
            </div>

            <!-- Carreras (Dinámico o Básico) -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Carrera</label>
                <select id="carrera" name="carrera" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 bg-white">
                    <option value="">Seleccione Carrera...</option>
                    <option value="Tecnicatura en Informatica">Tecnicatura en Informática</option>
                    <option value="Administracion">Administración</option>
                    <option value="Enfermeria">Enfermería</option>
                </select>
            </div>

            <!-- SECCIÓN CONDICIONAL DE ARCHIVOS PDF -->
            <div id="seccionArchivos" class="border-t border-gray-200 pt-4 space-y-4">
                <h3 class="text-lg font-medium text-gray-900">Documentación Requerida (Solo PDF, máx. 8MB c/u)</h3>
                <div id="inputsArchivosContainer" class="space-y-3">
                    <!-- Se inyecta dinámicamente con JavaScript -->
                </div>
            </div>

            <!-- Botón de Envío -->
            <div>
                <button type="submit" id="btnEnviar" class="w-full bg-indigo-600 text-white font-semibold py-2 px-4 rounded-md shadow hover:bg-indigo-700 transition duration-200">
                    Enviar Solicitud
                </button>
            </div>
        </form>

        <!-- Indicador de carga -->
        <div id="loading" class="hidden mt-4 text-center text-indigo-600 font-semibold">
            Procesando y subiendo documentación al servidor... Por favor, espere.
        </div>
        <div id="mensajeRespuesta" class="mt-4 text-center font-medium"></div>
    </div>

    <script>
        // Convertir campos de texto a mayúsculas automáticamente al salir del input
        document.querySelectorAll('.uppercase-input').forEach(input => {
            input.addEventListener('blur', function() {
                this.value = this.value.toUpperCase();
            });
        });

        function actualizarCamposArchivos() {
            const tramite = document.getElementById('tipoTramite').value;
            const container = document.getElementById('inputsArchivosContainer');
            container.innerHTML = '';

            if (!tramite) return;

            let campos = [];
            if (tramite.includes('Analítico')) {
                campos = [
                    { id: 'partidaNacimiento', label: 'Partida de Nacimiento (PDF)' },
                    { id: 'copiaDni', label: 'Copia de DNI (PDF)' },
                    { id: 'tituloAnterior', label: 'Título Anterior (PDF)' },
                    { id: 'comprobantePagoA', label: 'Comprobante de Pago - Monto A (PDF)' }
                ];
            } else if (tramite.includes('Título') || tramite.includes('Certificación')) {
                campos = [
                    { id: 'comprobantePagoB', label: 'Comprobante de Pago - Monto B (PDF)' },
                    { id: 'partidaActualizada', label: 'Partida de Nacimiento Actualizada (PDF)' },
                    { id: 'constanciaCuil', label: 'Constancia de CUIL (PDF)' },
                    { id: 'otraDocumentacion', label: 'Otra Documentación Requerida (PDF)' }
                ];
            }

            campos.forEach(campo => {
                const div = document.createElement('div');
                div.className = 'flex flex-col';
                div.innerHTML = `
                    <label class="text-sm font-medium text-gray-700">${campo.label}</label>
                    <input type="file" id="${campo.id}" name="${campo.id}" accept="application/pdf" required class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                `;
                container.appendChild(div);
            });
        }

        // Función auxiliar para convertir archivo a Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('tramiteForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btnEnviar = document.getElementById('btnEnviar');
            const loading = document.getElementById('loading');
            const mensajeRespuesta = document.getElementById('mensajeRespuesta');
            
            btnEnviar.disabled = true;
            loading.classList.remove('hidden');
            mensajeRespuesta.textContent = '';

            try {
                const tramite = document.getElementById('tipoTramite').value;
                const fileInputs = document.getElementById('inputsArchivosContainer').querySelectorAll('input[type="file"]');
                
                let archivosObj = {};
                for (let input of fileInputs) {
                    if (input.files.length > 0) {
                        const file = input.files[0];
                        if (file.size > 8 * 1024 * 1024) {
                            throw new Error(`El archivo ${file.name} supera el límite de 8 MB.`);
                        }
                        const base64Str = await fileToBase64(file);
                        archivosObj[input.id] = {
                            nombre: file.name,
                            tipo: file.type,
                            base64: base64Str
                        };
                    }
                }

                const payload = {
                    dni: document.getElementById('dni').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    apellido: document.getElementById('apellido').value.trim(),
                    nombre: document.getElementById('nombre').value.trim(),
                    sede: document.getElementById('sede').value.trim(),
                    tipoTramite: tramite,
                    carrera: document.getElementById('carrera').value.trim(),
                    archivos: archivosObj
                };

                // Reemplaza esta URL con la URL de tu Web App de Google Apps Script desplegada
                const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwRY251qidMY-mrXllnKGcokK2yslnjBG4A4PXUPGZboB4ZycNpcb3KLa0XIbcbm1WRyw/exec";

                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const resultado = await response.json();

                if (resultado.success) {
                    mensajeRespuesta.className = "mt-4 text-center font-medium text-green-600";
                    mensajeRespuesta.textContent = resultado.message;
                    document.getElementById('tramiteForm').reset();
                    document.getElementById('inputsArchivosContainer').innerHTML = '';
                } else {
                    throw new Error(resultado.message);
                }

            } catch (error) {
                mensajeRespuesta.className = "mt-4 text-center font-medium text-red-600";
                mensajeRespuesta.textContent = "Error: " + error.message;
            } finally {
                btnEnviar.disabled = false;
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
